name: memespace-staging

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile.staging
    image: memespace-staging:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      MEMESPACE_DATA_DIR: /app/data
      MEMESPACE_PORT: "5173"
      MEMESPACE_BIND_HOST: "0.0.0.0"
      MEMESPACE_PUBLIC_ORIGIN: "https://${STAGING_DOMAIN:?Set STAGING_DOMAIN}"
    volumes:
      - memespace_data:/app/data
    expose:
      - "5173"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(async r=>process.exit(r.ok&&(await r.json()).ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    networks:
      - staging_private

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      STAGING_DOMAIN: "${STAGING_DOMAIN:?Set STAGING_DOMAIN}"
      STAGING_BASIC_USER: "${STAGING_BASIC_USER:?Set STAGING_BASIC_USER}"
      STAGING_BASIC_PASSWORD_HASH: "${STAGING_BASIC_PASSWORD_HASH:?Set STAGING_BASIC_PASSWORD_HASH}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - staging_private

networks:
  staging_private:

volumes:
  memespace_data:
  caddy_data:
  caddy_config:
