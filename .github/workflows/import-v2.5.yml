name: One-time MemeSpace v2.5 integrated import

on:
  push:
    branches:
      - import/v2.5-neon-arcade

permissions:
  contents: write

jobs:
  import-source:
    if: contains(github.event.head_commit.message, '[memespace-v2.5-import]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged v2.5 import
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reconstruct integrated MemeSpace v2.5 source
        shell: bash
        run: |
          set -euo pipefail
          test -f .import/memespace-v25-overlay-min.b64

          base64 --decode .import/memespace-v25-overlay-min.b64 > /tmp/memespace-v25-overlay.tgz
          tar -xzf /tmp/memespace-v25-overlay.tgz -C .

          rm -rf .import
          rm -f .github/workflows/import-v2.5.yml

          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            ! -path './.next/*' \
            ! -path './.vinext/*' \
            ! -path './data/*' \
            ! -path './backups/*' \
            ! -name 'SHA256SUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

          node scripts/security-gate.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi

          git commit -m "feat: release MemeSpace v2.5 Neon Arcade"
          git push origin HEAD:main
