name: UI Evidence Capture

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: Commit generated runtime evidence back to the repository
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  capture:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Setup pinned pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # pinned 2026-09-20
        with:
          version: "11.25.0"
          install: "false"
      - name: Install MemeSpace dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Install capture browser
        run: |
          pnpm exec playwright install --with-deps chromium
      - name: Build and verify arcade controls in the production browser
        run: |
          pnpm build
          pnpm test:arcade-ui
          pnpm test:community-ui
      - name: Start MemeSpace with isolated data
        env:
          MEMESPACE_PORT: "5173"
          MEMESPACE_DATA_DIR: ${{ runner.temp }}/memespace-data
        run: |
          nohup node scripts/local.mjs serve > /tmp/memespace.log 2>&1 &
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:5173/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/memespace.log
          exit 1
      - name: Capture real MemeSpace evidence
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5173
        run: node tools/capture_ui_evidence.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memespace-runtime-evidence
          path: docs/evidence/runtime/
      - name: Commit evidence
        if: ${{ inputs.commit_results }}
        run: |
          git config user.name "DPN Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/evidence/runtime/
          git diff --cached --quiet && exit 0
          git commit -m "evidence: refresh MemeSpace runtime captures"
          git push
