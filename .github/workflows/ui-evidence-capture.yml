name: UI Evidence Capture

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: Commit generated runtime evidence back to the repository
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install MemeSpace dependencies
        run: npm exec --yes --package=pnpm@11.25.0 -- pnpm install --frozen-lockfile --prod=false
      - name: Install capture browser
        run: |
          npm exec --yes --package=playwright@1.56.1 -- playwright install --with-deps chromium
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Start MemeSpace with isolated data
        env:
          MEMESPACE_PORT: "5173"
          MEMESPACE_DATA_DIR: ${{ runner.temp }}/memespace-data
        run: |
          nohup node scripts/local.mjs start > /tmp/memespace.log 2>&1 &
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:5173/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/memespace.log
          exit 1
      - name: Capture real MemeSpace evidence
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5173
        run: node tools/capture_ui_evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: memespace-runtime-evidence
          path: docs/evidence/runtime/
      - name: Commit evidence
        if: ${{ inputs.commit_results }}
        run: |
          git config user.name "DPN Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/evidence/runtime/
          git diff --cached --quiet && exit 0
          git commit -m "evidence: refresh MemeSpace runtime captures"
          git push
