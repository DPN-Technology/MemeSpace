name: Publish downloadable Windows tester ZIP

on:
  push:
    branches: [main]
    paths:
      - 'distribution/windows-tester/**'
      - '.github/workflows/publish-windows-tester.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memespace-v250-windows-release-asset
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'DPN-Technology/MemeSpace'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out distribution files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble Windows tester download
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('distribution/windows-tester')
          expected = [
              'LAUNCH-MEMESPACE.cmd',
              'LAUNCH-CONTROL-CENTER.cmd',
              'RESET-DOWNLOAD.cmd',
              'START-HERE.txt',
              'tools/tester.ps1',
          ]
          for path in expected:
              if not (root / path).is_file():
                  raise SystemExit('Missing required distribution file: ' + path)
          asset = Path('MemeSpace-v2.5.0-Windows-Tester.zip')
          with ZipFile(asset, 'w', compression=ZIP_DEFLATED, compresslevel=9) as z:
              for file in sorted(root.rglob('*')):
                  if file.is_file():
                      z.write(file, file.relative_to(root).as_posix())
          print('ZIP ready:', asset, asset.stat().st_size, 'bytes')
          PY
          sha256sum MemeSpace-v2.5.0-Windows-Tester.zip

      - name: Publish ZIP to official v2.5.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v2.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v2.5.0 MemeSpace-v2.5.0-Windows-Tester.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release view v2.5.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Fx 'MemeSpace-v2.5.0-Windows-Tester.zip'
          echo "Windows tester download published:"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/v2.5.0/MemeSpace-v2.5.0-Windows-Tester.zip"
