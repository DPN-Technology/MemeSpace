name: Code Scanning Alert Inventory

on:
  push:
    branches:
      - maintenance/code-scanning-alert-cleanup

permissions:
  contents: read
  security-events: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inventory open code scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${REPO}/code-scanning/alerts?state=open&per_page=100"             -o alerts.json
          node - <<'NODE'
          const fs = require('fs');
          const xs = JSON.parse(fs.readFileSync('alerts.json','utf8'));
          const out = xs.map(x => ({
            number: x.number,
            state: x.state,
            rule: {
              id: x.rule?.id,
              name: x.rule?.name,
              severity: x.rule?.severity,
              security_severity_level: x.rule?.security_severity_level
            },
            tool: x.tool?.name,
            created_at: x.created_at,
            updated_at: x.updated_at,
            fixed_at: x.fixed_at,
            dismissed_at: x.dismissed_at,
            html_url: x.html_url,
            most_recent_instance: x.most_recent_instance ? {
              ref: x.most_recent_instance.ref,
              analysis_key: x.most_recent_instance.analysis_key,
              category: x.most_recent_instance.category,
              environment: x.most_recent_instance.environment,
              state: x.most_recent_instance.state,
              commit_sha: x.most_recent_instance.commit_sha,
              message: x.most_recent_instance.message?.text,
              location: x.most_recent_instance.location
            } : null
          }));
          console.log(JSON.stringify({count: out.length, alerts: out},null,2));
          NODE
