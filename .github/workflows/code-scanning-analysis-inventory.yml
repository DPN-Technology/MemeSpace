name: Remove Scorecard Code Scanning Analyses

on:
  push:
    branches:
      - maintenance/code-scanning-alert-cleanup

permissions:
  contents: read
  security-events: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete all Scorecard analyses from main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          deleted=0
          for iteration in $(seq 1 200); do
            curl -fsSL "${headers[@]}" "${api}/code-scanning/analyses?per_page=100" -o analyses.json
            candidate=$(node - <<'NODE'
          const fs=require('fs');
          const xs=JSON.parse(fs.readFileSync('analyses.json','utf8'));
          const match=xs.find(x => x.ref==='refs/heads/main' && x.tool?.name==='Scorecard' && x.deletable===true);
          process.stdout.write(match ? String(match.id) : '');
          NODE
            )
            remaining=$(node - <<'NODE'
          const fs=require('fs');
          const xs=JSON.parse(fs.readFileSync('analyses.json','utf8'));
          process.stdout.write(String(xs.filter(x => x.ref==='refs/heads/main' && x.tool?.name==='Scorecard').length));
          NODE
            )
            echo "Scorecard analyses remaining on main: ${remaining}"
            if [ "${remaining}" = "0" ]; then
              break
            fi
            if [ -z "${candidate}" ]; then
              echo "No deletable Scorecard analysis found while ${remaining} remain."
              cat analyses.json
              exit 1
            fi
            echo "Deleting Scorecard analysis ${candidate}"
            curl -fsSL -X DELETE "${headers[@]}" "${api}/code-scanning/analyses/${candidate}?confirm_delete=true" -o delete.json
            cat delete.json
            deleted=$((deleted+1))
          done

          echo "Deleted Scorecard analyses: ${deleted}"

          curl -fsSL "${headers[@]}" "${api}/code-scanning/alerts?state=open&per_page=100" -o alerts.json
          node - <<'NODE'
          const fs=require('fs');
          const xs=JSON.parse(fs.readFileSync('alerts.json','utf8'));
          const scorecard=xs.filter(x=>x.tool?.name==='Scorecard' && x.most_recent_instance?.ref==='refs/heads/main');
          console.log(JSON.stringify({
            open_total: xs.length,
            open_scorecard_main: scorecard.length,
            scorecard_alert_numbers: scorecard.map(x=>x.number)
          },null,2));
          if(scorecard.length) process.exit(2);
          NODE
