name: Publish MemeSpace v2.5.0

# Release trigger

on:
  push:
    branches:
      - maintenance/code-scanning-alert-cleanup

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create stable release from verified main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: "13bbe1acf118af8ff203edfa4758c7fee41da5e5"
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          current_main=$(curl -fsSL "${auth[@]}" "${api}/commits/main" | node -pe "JSON.parse(fs.readFileSync(0,'utf8')).sha")
          if [ "${current_main}" != "${TARGET_SHA}" ]; then
            echo "main moved from verified release SHA: ${current_main}"
            exit 1
          fi

          existing=$(curl -sS -o existing.json -w "%{http_code}" "${auth[@]}" "${api}/releases/tags/v2.5.0")
          if [ "${existing}" = "200" ]; then
            echo "v2.5.0 already exists."
            cat existing.json
            exit 0
          fi

          cat > release.json <<'JSON'
          {
            "tag_name": "v2.5.0",
            "target_commitish": "13bbe1acf118af8ff203edfa4758c7fee41da5e5",
            "name": "MemeSpace v2.5.0",
            "body": "## MemeSpace v2.5.0\n\nStable release from a fully green main branch.\n\n### Security & quality\n- All CI, CodeQL, Code Quality, dependency audit, SBOM, secret scan, DPN Security Baseline, DPN Enterprise Security, and DPN Enterprise Standard gates passed.\n- Remaining dependency vulnerabilities were remediated and the lockfile regenerated.\n- Code-scanning findings were resolved.\n- OpenSSF Scorecard governance telemetry was separated from Code Scanning so maturity checks do not appear as code errors.\n- Workflow permissions were tightened and pnpm bootstrap was pinned immutably.\n\n### Release baseline\n- App version: 2.5.0\n- Node.js: >=24\n- Package manager: pnpm 11.25.0\n- Release commit: 13bbe1acf118af8ff203edfa4758c7fee41da5e5",
            "draft": false,
            "prerelease": false,
            "generate_release_notes": false
          }
          JSON

          curl -fsSL -X POST "${auth[@]}" -H "Content-Type: application/json" "${api}/releases" --data-binary @release.json -o created.json
          cat created.json
