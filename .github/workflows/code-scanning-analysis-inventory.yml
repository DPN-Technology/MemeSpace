name: Code Scanning Analysis Inventory

on:
  push:
    branches:
      - maintenance/code-scanning-alert-cleanup

permissions:
  contents: read
  security-events: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inventory code scanning analyses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${REPO}/code-scanning/analyses?per_page=100"             -o analyses.json
          node - <<'NODE'
          const fs = require('fs');
          const xs = JSON.parse(fs.readFileSync('analyses.json','utf8'));
          const out = xs.map(x => ({
            id: x.id,
            ref: x.ref,
            commit_sha: x.commit_sha,
            analysis_key: x.analysis_key,
            category: x.category,
            tool: x.tool?.name,
            tool_version: x.tool?.version,
            environment: x.environment,
            created_at: x.created_at,
            deletable: x.deletable,
            warning: x.warning
          }));
          console.log(JSON.stringify(out,null,2));
          NODE
