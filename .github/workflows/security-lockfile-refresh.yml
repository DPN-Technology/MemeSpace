name: Temporary Security Lockfile Refresh

on:
  push:
    branches: [security/dev-audit-hardening]
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh patched dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/dev-audit-hardening
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          check-latest: false
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Regenerate lockfile under supply-chain policy
        run: pnpm install --lockfile-only

      - name: Validate generated diff
        run: git diff --check

      - name: Commit refreshed lockfile
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "security: refresh patched dependency lockfile"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:security/dev-audit-hardening
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
