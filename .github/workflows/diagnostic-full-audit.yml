name: Diagnostic Full Dependency Audit

on:
  push:
    branches: [security/dev-audit-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Full graph high-severity diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          check-latest: false
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Print high-severity dependency audit
        run: pnpm audit --audit-level high || true
