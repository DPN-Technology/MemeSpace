name: Apply MemeSpace v2.2 Source

on:
  push:
    branches: [security/dev-audit-hardening]
    paths:
      - ".v22-upload/**"
      - ".github/workflows/v22-overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Verify and apply v2.2 overlay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/dev-audit-hardening
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct verified source overlay
        run: |
          cat .v22-upload/part-* | base64 --decode > /tmp/memespace-v22-overlay.tar.gz
          echo "e101c7c5bf17309bbdc497e804dfd075c569d515e47f1c76b603be3ac22c2697  /tmp/memespace-v22-overlay.tar.gz" | sha256sum --check
          tar -xzf /tmp/memespace-v22-overlay.tar.gz -C .
          test "$(node -p "require('./package.json').version")" = "2.2.0"
          test -f app/module-upgrades.tsx
          test -f RELEASE-v2.2.md
          git diff --check

      - name: Remove temporary transfer material
        run: |
          rm -rf .v22-upload
          rm -f .github/workflows/v22-overlay.yml
          git add -A

      - name: Commit MemeSpace v2.2
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: update MemeSpace to v2.2 Emerald Mind"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:security/dev-audit-hardening
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
