name: Security Patch Lockfile Generation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/security-patch-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve patched dependencies without repository write credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Setup pinned pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # pinned 2026-09-20
        with:
          version: "11.25.0"
          install: "false"
      - name: Resolve verified October 2026 security patch versions
        run: |
          set -euo pipefail
          pnpm update -E next@16.4.1 eslint-config-next@16.4.1 react-server-dom-webpack@19.2.9 react@19.2.9 react-dom@19.2.9 --lockfile-only
          echo "<<< BEGIN SECURITY UPDATE PATCH >>>"
          git diff -- package.json pnpm-lock.yaml | base64 -w 0 | fold -w 180
          echo "<<< END SECURITY UPDATE PATCH >>>"
