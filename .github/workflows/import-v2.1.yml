name: One-time MemeSpace v2.1 source import

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    if: contains(github.event.head_commit.message, '[memespace-v2.1-import]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import MemeSpace v2.1 source
        shell: bash
        run: |
          set -euo pipefail
          test -f .import/MemeSpace_v2.1.tar.xz
          tar -xJf .import/MemeSpace_v2.1.tar.xz -C .

          rm -f .import/MemeSpace_v2.1.tar.xz
          rmdir .import 2>/dev/null || true
          rm -f .github/workflows/import-v2.1.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi

          git commit -m "feat: import MemeSpace v2.1 source"
          git push origin HEAD:main
