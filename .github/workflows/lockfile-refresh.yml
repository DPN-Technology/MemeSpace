name: Temporary Lockfile Refresh

on:
  push:
    branches: [security/ci-hardening]
    paths:
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/ci-hardening
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.20.0"
          check-latest: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Regenerate frozen dependency graph
        run: pnpm install --lockfile-only

      - name: Validate generated diff
        run: git diff --check

      - name: Commit refreshed lockfile
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "security: refresh lockfile for browserslist advisory"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:security/ci-hardening
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
