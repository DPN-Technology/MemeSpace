name: Vite Security Lockfile Patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vite-security-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Re-lock patched Vite development tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Setup pinned pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # pinned 2026-09-20
        with:
          version: "11.25.0"
          install: "false"
      - name: Resolve patched Vite without privileged Git credentials
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const path='pnpm-workspace.yaml';const s=fs.readFileSync(path,'utf8');if(!s.includes('  vite: 8.0.16'))process.exit(2);fs.writeFileSync(path,s.replace('  vite: 8.0.16','  vite: 8.1.6'));"
          pnpm update -E vite@8.1.6 --lockfile-only
          echo "<<< BEGIN VITE SECURITY UPDATE PATCH >>>"
          git diff -- package.json pnpm-workspace.yaml pnpm-lock.yaml | base64 -w 0 | fold -w 180
          echo "<<< END VITE SECURITY UPDATE PATCH >>>"
