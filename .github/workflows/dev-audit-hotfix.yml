name: One-time dev dependency security hotfix

on:
  push:
    branches:
      - security/dev-audit-hotfix

permissions:
  contents: write

jobs:
  hotfix:
    if: contains(github.event.head_commit.message, '[dev-audit-hotfix]')
    runs-on: ubuntu-24.04
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout security hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          check-latest: false
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Regenerate lockfile for security overrides
        run: pnpm install --lockfile-only
      - name: Verify production audit
        run: pnpm audit --prod --audit-level high
      - name: Verify full dependency audit
        run: pnpm audit --audit-level high
      - name: Verify repository policy
        run: node scripts/security-gate.mjs
      - name: Commit security hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dev-audit-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml scripts/security-gate.mjs .github/workflows/dev-audit-hotfix.yml
          git commit -m "security: patch audited transitive dependencies"
          git push origin HEAD:main
