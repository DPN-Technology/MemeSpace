name: Publish MemeSpace Tester to GitHub Packages
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
concurrency:
  group: memespace-tester-package
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v2.5.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact v2.5.0 release source
        uses: actions/checkout@v4
        with:
          ref: v2.5.0
          persist-credentials: false
      - name: Set up Docker build
        uses: docker/setup-buildx-action@v3
      - name: Authenticate GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release tester
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.tester
          push: true
          tags: |
            ghcr.io/dpn-technology/memespace-tester:2.5.0
          labels: |
            org.opencontainers.image.source=https://github.com/DPN-Technology/MemeSpace
            org.opencontainers.image.version=2.5.0
            org.opencontainers.image.title=MemeSpace Tester
