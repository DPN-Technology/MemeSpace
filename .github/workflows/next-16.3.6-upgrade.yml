name: One-time Next.js security upgrade

on:
  push:
    branches:
      - security/next-16.3.6

permissions:
  contents: write

jobs:
  upgrade:
    if: contains(github.event.head_commit.message, '[next-16.3.6-upgrade]')
    runs-on: ubuntu-24.04
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout security upgrade branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          check-latest: false
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Regenerate frozen lockfile for patched Next.js
        run: pnpm install --lockfile-only
      - name: Verify patched production graph
        run: pnpm audit --prod --audit-level high
      - name: Verify repository security policy
        run: node scripts/security-gate.mjs
      - name: Commit patched dependency graph
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/next-16.3.6-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml .github/workflows/next-16.3.6-upgrade.yml
          git commit -m "security: patch Next.js RCE advisory"
          git push origin HEAD:main
