name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Static policy · Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          check-latest: false
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Static repository security policy
        run: node scripts/security-gate.mjs

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Block high or critical production advisories
        run: pnpm audit --prod --audit-level high

      - name: Review high or critical advisories in development graph
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level high > /tmp/pnpm-audit.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat /tmp/pnpm-audit.txt
            exit 0
          fi
          if grep -q "braces vulnerable to stack-exhaustion denial of service" /tmp/pnpm-audit.txt &&
             grep -q "glob>micromatch>braces" /tmp/pnpm-audit.txt; then
            echo "::warning::Known upstream dev-tooling advisory: braces@3.0.3 (CVE-2026-93687). No patched upstream release exists yet; production dependency audit remains blocking. Other high/critical findings will still fail this gate."
            high_count=$(grep -Ec "^[[:space:]]*│ high[[:space:]]*│" /tmp/pnpm-audit.txt || true)
            critical_count=$(grep -Ec "^[[:space:]]*│ critical[[:space:]]*│" /tmp/pnpm-audit.txt || true)
            if [[ "$critical_count" -gt 0 || "$high_count" -gt 1 ]]; then
              cat /tmp/pnpm-audit.txt
              exit "$status"
            fi
            exit 0
          fi
          cat /tmp/pnpm-audit.txt
          exit "$status"
