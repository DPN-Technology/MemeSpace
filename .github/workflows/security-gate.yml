name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Static policy · Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          check-latest: false
          package-manager-cache: false

      - name: Setup pinned pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # pinned 2026-09-20
        with:
          version: "11.25.0"
          install: "false"

      - name: Static repository security policy
        run: node scripts/security-gate.mjs

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Block high or critical production advisories
        run: pnpm audit --prod --audit-level high

      # Exception policy: permit only the single documented dev-only braces advisory
      # by exact CVE/GHSA identity; any additional high or critical finding remains blocking.
      - name: Review high or critical advisories in development graph
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level high > /tmp/pnpm-audit.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat /tmp/pnpm-audit.txt
            exit 0
          fi
          severity_summary=$(grep -E "^Severity:" /tmp/pnpm-audit.txt | tail -n 1 || true)
          high_count=$(printf '%s\n' "$severity_summary" | sed -nE 's/.*(^|[|[:space:]])([0-9]+) high([[:space:]|]|$).*/\2/p')
          critical_count=$(printf '%s\n' "$severity_summary" | sed -nE 's/.*(^|[|[:space:]])([0-9]+) critical([[:space:]|]|$).*/\2/p')
          high_count=${high_count:-0}
          critical_count=${critical_count:-0}
          if grep -Eq "CVE-2026-93687|GHSA-vfj7-8cjw-p6xm" /tmp/pnpm-audit.txt &&
             grep -Eq "braces(@|[[:space:]])?3\.0\.3|braces" /tmp/pnpm-audit.txt &&
             [[ "$critical_count" -eq 0 && "$high_count" -eq 1 ]]; then
            echo "::warning::Known upstream dev-tooling advisory only: braces@3.0.3 (CVE-2026-93687 / GHSA-vfj7-8cjw-p6xm). No patched upstream release exists as of 2026-10-04; production dependency audit remains blocking and any additional high/critical advisory still fails this gate."
            exit 0
          fi
          cat /tmp/pnpm-audit.txt
          exit "$status"
