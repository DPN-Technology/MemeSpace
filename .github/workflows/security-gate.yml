name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Static policy · Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          check-latest: false
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Static repository security policy
        run: node scripts/security-gate.mjs

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Block high or critical production advisories
        run: pnpm audit --prod --audit-level high

      - name: Block high or critical advisories anywhere in the graph
        run: pnpm audit --audit-level high
