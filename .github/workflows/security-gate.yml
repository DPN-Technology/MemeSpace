name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Static policy · Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.20.0"
          check-latest: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Static repository security policy
        run: node scripts/security-gate.mjs

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Block high or critical production advisories
        run: pnpm audit --prod --audit-level high

      - name: Block critical advisories anywhere in the graph
        run: pnpm audit --audit-level critical
