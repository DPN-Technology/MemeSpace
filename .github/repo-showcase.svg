<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="220" viewBox="0 0 1440 220" role="img" aria-labelledby="title desc">
  <title id="title">One space. Four connected experiences.</title>
  <desc id="desc">Meme Mind, Community, Neon Arcade and Control Center presented in mint and lavender on a dark background.</desc>
  <rect width="1440" height="220" rx="20" fill="#0A100D"/>
  <g fill="none" stroke="#24382B"><rect x="16" y="16" width="1408" height="188" rx="13"/><path d="M368 39V181M720 39V181M1072 39V181"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(48 42)">
      <text y="18" fill="#A5FFB4" font-size="13" letter-spacing="3">01 / EXPLORE</text>
      <text y="65" fill="#EEF4F0" font-size="30" font-weight="700">The Meme Mind</text>
      <text y="101" fill="#9CB2A4" font-size="17">Binary head. Living brain.</text>
      <text y="126" fill="#9CB2A4" font-size="17">Culture, history and discovery.</text>
    </g>
    <g transform="translate(400 42)">
      <text y="18" fill="#C9B6F6" font-size="13" letter-spacing="3">02 / CONNECT</text>
      <text y="65" fill="#EEF4F0" font-size="30" font-weight="700">Community</text>
      <text y="101" fill="#9CB2A4" font-size="17">Your profile. Your creations.</text>
      <text y="126" fill="#9CB2A4" font-size="17">A place to share and learn.</text>
    </g>
    <g transform="translate(752 42)">
      <text y="18" fill="#A5FFB4" font-size="13" letter-spacing="3">03 / PLAY</text>
      <text y="65" fill="#EEF4F0" font-size="30" font-weight="700">Neon Arcade</text>
      <text y="101" fill="#9CB2A4" font-size="17">Six cabinets. Fresh challenges.</text>
      <text y="126" fill="#9CB2A4" font-size="17">One more round.</text>
    </g>
    <g transform="translate(1104 42)">
      <text y="18" fill="#C9B6F6" font-size="13" letter-spacing="3">04 / OPERATE</text>
      <text y="65" fill="#EEF4F0" font-size="30" font-weight="700">Control Center</text>
      <text y="101" fill="#9CB2A4" font-size="17">Staff access. Real operations.</text>
      <text y="126" fill="#9CB2A4" font-size="17">Keep the community moving.</text>
    </g>
  </g>
  <path d="M36 203H353M387 203H705M739 203H1057M1091 203H1404" stroke="#A5FFB4" stroke-opacity=".35"/>
</svg>
